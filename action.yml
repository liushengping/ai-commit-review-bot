name: 'AI Commit Review Bot'
description: 'Automated AI-powered code review for Pull Requests. Supports GitHub, GitLab, Bitbucket, Gitea. Works with MiMo, Claude, GPT and more.'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  # ── Platform ───────────────────────────────────────────────
  platform:
    description: 'SCM platform: github, gitlab, gitea, bitbucket (auto-detected if omitted)'
    required: false
    default: ''

  github-token:
    description: 'GitHub token for posting review comments'
    required: false
    default: '${{ github.token }}'

  gitlab-token:
    description: 'GitLab token (for GitLab CI)'
    required: false
    default: ''

  gitea-token:
    description: 'Gitea token (for Gitea Actions)'
    required: false
    default: ''

  bitbucket-token:
    description: 'Bitbucket token (for Bitbucket Pipelines)'
    required: false
    default: ''

  # ── AI Model ───────────────────────────────────────────────
  api-key:
    description: 'API key for the AI model provider'
    required: true

  api-base-url:
    description: 'API base URL (e.g. https://api.xiaomimimo.com/v1 for MiMo, https://api.anthropic.com/v1 for Claude)'
    required: false
    default: 'https://api.xiaomimimo.com/v1'

  model:
    description: 'Model name (e.g. MiMo-V2.5-Pro, claude-sonnet-4-20250514, gpt-4o)'
    required: false
    default: 'MiMo-V2.5-Pro'

  fallback-model:
    description: 'Fallback model if primary model fails (e.g. deepseek-chat)'
    required: false
    default: ''

  provider:
    description: 'AI provider type: openai-compatible or anthropic'
    required: false
    default: 'openai-compatible'

  # ── Review Options ─────────────────────────────────────────
  max-diff-lines:
    description: 'Maximum number of diff lines to send for review (to control token usage)'
    required: false
    default: '500'

  review-language:
    description: 'Language for review comments (e.g. zh, en)'
    required: false
    default: 'zh'

  skip-if-no-diff:
    description: 'Skip review if PR has no code changes'
    required: false
    default: 'true'

  auto-approve:
    description: 'Auto-approve PR if no issues are found'
    required: false
    default: 'false'

  inline-comments:
    description: 'Post inline comments on specific code lines with issues'
    required: false
    default: 'true'

  block-threshold:
    description: 'Minimum severity level to block the PR (none, info, warning, error, critical)'
    required: false
    default: 'critical'

runs:
  using: 'node20'
  main: 'src/index.js'
