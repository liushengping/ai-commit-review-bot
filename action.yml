name: 'AI Commit Review Bot'
description: 'Automated AI-powered code review for Pull Requests. Supports MiMo, Claude, GPT and more.'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for posting review comments'
    required: true
    default: '${{ github.token }}'

  api-key:
    description: 'API key for the AI model provider'
    required: true

  api-base-url:
    description: 'API base URL (e.g. https://api.xiaomimimo.com/v1 for MiMo, https://api.anthropic.com/v1 for Claude)'
    required: false
    default: 'https://api.xiaomimimo.com/v1'

  model:
    description: 'Model name (e.g. MiMo-V2.5-Pro, claude-sonnet-4-20250514, gpt-4o)'
    required: false
    default: 'MiMo-V2.5-Pro'

  provider:
    description: 'AI provider type: openai-compatible or anthropic'
    required: false
    default: 'openai-compatible'

  max-diff-lines:
    description: 'Maximum number of diff lines to send for review (to control token usage)'
    required: false
    default: '500'

  review-language:
    description: 'Language for review comments (e.g. zh, en)'
    required: false
    default: 'zh'

  skip-if-no-diff:
    description: 'Skip review if PR has no code changes'
    required: false
    default: 'true'

runs:
  using: 'node20'
  main: 'src/index.js'
